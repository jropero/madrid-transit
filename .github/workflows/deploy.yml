name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Nightly, after Renfe's ~03:00 timetable update (03:30/04:30 Madrid).
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Keep in sync with devEngines.packageManager in package.json (the action only reads
      # the top-level packageManager field, which this repo doesn't use).
      - uses: pnpm/action-setup@v4
        with:
          version: 12.23.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          NAP_TOKEN: ${{ secrets.NAP_TOKEN }}

      - name: Sanity gate
        run: node scripts/check-dist.mjs dist

      - name: PHP lint
        run: php -l dist/rt.php && php -l dist/rt-stops.php

      # Only requests that are rejected before any upstream fetch (bad format, unknown stop).
      - name: rt.php smoke test
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:8099 -t dist > /tmp/php-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8099/rt.php && break
            sleep 0.2
          done
          check() {
            got="$(curl -s -o /tmp/smoke.out -w '%{http_code}' "http://127.0.0.1:8099/rt.php?$1")"
            if [ "$got" != "$2" ]; then
              echo "rt.php?$1: expected $2, got $got" >&2
              cat /tmp/smoke.out >&2
              exit 1
            fi
          }
          check 'f=x' 400
          check 'f=crtm&stop=8_999999999' 400
          check 'f=crtm&stop=8_0' 404
          check 'f=crtm_avisos&m=x' 400
          check 'f=emt&stop=0' 404
          # The debug log answers without any upstream call: a JSON array.
          check 'f=crtm&stop=8_16578&log=1' 200
          grep -q '^\[' /tmp/smoke.out
          # The allow-list file must not output anything when requested directly.
          [ -z "$(curl -s http://127.0.0.1:8099/rt-stops.php)" ]
          echo "rt.php smoke test ok"

      - name: Deploy
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST_FP: ${{ vars.SSH_HOST_FP }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          EMT_CLIENT_ID: ${{ secrets.EMT_CLIENT_ID }}
          EMT_PASS_KEY: ${{ secrets.EMT_PASS_KEY }}
          EMT_EMAIL: ${{ secrets.EMT_EMAIL }}
          EMT_PASSWORD: ${{ secrets.EMT_PASSWORD }}
        run: |
          set -euo pipefail
          # rsync --delete empties the target: refuse anything that is not the /m folder.
          case "$DEPLOY_PATH" in
            */m) ;;
            *) echo "DEPLOY_PATH must end in /m" >&2; exit 1 ;;
          esac
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # Pin the host key by fingerprint instead of trusting whatever the scan returns.
          if [ -z "${SSH_HOST_FP:-}" ]; then
            echo "SSH_HOST_FP variable is empty; set it to the server's ED25519 SHA256 fingerprint" >&2
            exit 1
          fi
          tmp="$(mktemp)"
          ssh-keyscan -T 10 -t ed25519 -p "$SSH_PORT" "$SSH_HOST" 2>/dev/null > "$tmp"
          if [ ! -s "$tmp" ]; then
            echo "ssh-keyscan returned no ED25519 host key" >&2
            exit 1
          fi
          got="$(ssh-keygen -lf "$tmp" -E sha256 | awk '{print $2}')"
          if [ "$got" != "$SSH_HOST_FP" ]; then
            echo "Host key fingerprint mismatch" >&2
            echo "expected: $SSH_HOST_FP" >&2
            echo "got:      $got" >&2
            exit 1
          fi
          install -m 600 "$tmp" ~/.ssh/known_hosts
          rm -f "$tmp"
          rsync -az --delete --delay-updates \
            -e "ssh -i $HOME/.ssh/deploy -p $SSH_PORT -o IdentitiesOnly=yes" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          # EMT credentials for rt.php: a file outside the web root ($DEPLOY_PATH is
          # .../public_html/m, so ../../emt.json is next to public_html). Never echoed.
          # Include only complete pairs: email/password (works) and/or clientId/passKey (legacy).
          emt="$(mktemp)"
          jq -n \
            --arg e "${EMT_EMAIL:-}" --arg w "${EMT_PASSWORD:-}" \
            --arg c "${EMT_CLIENT_ID:-}" --arg p "${EMT_PASS_KEY:-}" '
            (if $e != "" and $w != "" then {email: $e, password: $w} else {} end)
            + (if $c != "" and $p != "" then {clientId: $c, passKey: $p} else {} end)' > "$emt"
          chmod 600 "$emt"
          if [ "$(jq 'length' "$emt")" -gt 0 ]; then
            rsync -a --chmod=F600 \
              -e "ssh -i $HOME/.ssh/deploy -p $SSH_PORT -o IdentitiesOnly=yes" \
              "$emt" "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/../../emt.json"
          else
            echo "::notice::No complete EMT_EMAIL/EMT_PASSWORD or EMT_CLIENT_ID/EMT_PASS_KEY pair: emt.json not uploaded"
          fi
          rm -f "$emt"
